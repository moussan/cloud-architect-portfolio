name: Terraform Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tfsec:
    name: tfsec Security Scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - projects/01-ha-web-app/terraform
          - projects/02-serverless-pipeline/terraform
          - projects/03-landing-zone/terraform
          - projects/04-eks-application-deployment/terraform
          - projects/05-hybrid-cloud-architecture/terraform
          - projects/06-data-lake/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tfsec
        if: ${{ hashFiles(format('{0}/**/*.tf', matrix.project)) != '' }}
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ matrix.project }}
          # while you're iterating you *can* flip this to true:
          soft_fail: true

      - name: Skip (no Terraform in this project yet)
        if: ${{ hashFiles(format('{0}/**/*.tf', matrix.project)) == '' }}
        run: echo "Skipping tfsec for ${{ matrix.project }} – no Terraform files found."
