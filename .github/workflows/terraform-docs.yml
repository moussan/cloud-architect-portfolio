name: Terraform Docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'

jobs:
  terraform-docs:
    name: Auto-generate Module Documentation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - 01-governance/landing-zone/terraform
          - 01-governance/iam/terraform
          - 01-governance/scps/terraform
          - 02-networking/hub-spoke/terraform
          - 02-networking/vpc-design/terraform
          - 03-iac/state-backend/terraform
          - 03-iac/compute/terraform
          - 03-iac/storage/terraform
          - 03-iac/database/terraform
          - 03-iac/modules/vpc
          - 03-iac/modules/iam-role

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Render terraform-docs
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: ${{ matrix.module }}
          output-file: TERRAFORM_DOCS.md
          output-method: inject
          git-push: "true"
