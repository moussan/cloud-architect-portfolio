name: Terraform Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    strategy:
      # This matrix allows checking each project independently
      matrix:
        project:
          - projects/01-ha-web-app/terraform
          - projects/02-serverless-pipeline/terraform
          - projects/03-landing-zone/terraform
          - projects/04-eks-app-deployment/terraform
          - projects/05-hybrid-cloud/terraform
          - projects/06-data-lake/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Format Check
        working-directory: ${{ matrix.project }}
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ${{ matrix.project }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ matrix.project }}
        run: terraform validate
